; ============================================================
;  AquaLeaf — Intelligent Plant Irrigation Platform
;  PlatformIO Project Configuration
;  Target: ESP8266 NodeMCU v1.0 / v2 / v3 (4MB Flash)
; ============================================================

[platformio]
default_envs = nodemcu_v2
description   = AquaLeaf Intelligent Plant Irrigation Platform

; ──────────────────────────────────────────────────────────
;  Shared / common settings
; ──────────────────────────────────────────────────────────
[common]
framework     = arduino
monitor_speed = 115200
upload_speed  = 921600

build_flags =
    -DAQUA_VERSION=\"1.0.0\"
    -Os
    -Wall

; ──────────────────────────────────────────────────────────
;  Shared library dependencies
; ──────────────────────────────────────────────────────────
[libs]
lib_deps =
    knolleary/PubSubClient @ ^2.8.0
    blynkkk/Blynk          @ ^1.3.2
    bblanchon/ArduinoJson  @ ^7.2.1

; ──────────────────────────────────────────────────────────
;  NodeMCU (ESP-12E / ESP-12F) — primary target.
;  NodeMCU v3 ("LoLin") boards use the same board definition.
; ──────────────────────────────────────────────────────────
[env:nodemcu_v2]
platform      = espressif8266 @ ^4.2.1
board         = nodemcuv2
framework     = ${common.framework}
monitor_speed = ${common.monitor_speed}
upload_speed  = ${common.upload_speed}
build_flags   = ${common.build_flags}
lib_deps      = ${libs.lib_deps}

; Filesystem (LittleFS) for web dashboard assets
board_build.filesystem = littlefs

; Compile src/ into on-device unit tests (main.cpp is guarded by PIO_UNIT_TESTING)
test_build_src = yes
; test_network is a placeholder (needs a live WiFi/MQTT setup);
; test_native_* run on the host via env:native
test_ignore    = test_network, test_native_*

; Checks that include/Secrets.h exists before building
extra_scripts =
    pre:scripts/pre_build.py

; ──────────────────────────────────────────────────────────
;  Over-the-air upload (after the first USB flash).
;    $env:AQUALEAF_OTA_PASSWORD = "<OTA_PASSWORD from Secrets.h>"
;    pio run -e nodemcu_v2_ota -t upload
;  Use the device IP instead of aqualeaf.local if mDNS does not resolve.
; ──────────────────────────────────────────────────────────
[env:nodemcu_v2_ota]
extends         = env:nodemcu_v2
upload_protocol = espota
upload_port     = aqualeaf.local
upload_flags    = --auth=${sysenv.AQUALEAF_OTA_PASSWORD}

; ──────────────────────────────────────────────────────────
;  Host-side unit tests for the hardware-independent logic in
;  src/logic/ (needs a native gcc/g++; runs in GitHub Actions):
;    pio test -e native
; ──────────────────────────────────────────────────────────
[env:native]
platform         = native
build_src_filter = +<logic/>
test_build_src   = yes
test_filter      = test_native_*
build_flags      = -std=gnu++17 -Wall -Wextra
